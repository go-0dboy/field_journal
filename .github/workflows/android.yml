name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          manager="$(command -v sdkmanager || true)"
          if [ -z "$manager" ] && [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$manager" ]; then
            archive="$RUNNER_TEMP/android-command-line-tools.zip"
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              --output "$archive"
            unzip -q "$archive" -d "$RUNNER_TEMP/android-tools"
            mkdir -p "$sdk/cmdline-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/field-journal"
            manager="$sdk/cmdline-tools/field-journal/bin/sdkmanager"
          fi
          (yes || true) | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          "$manager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/field-journal-preview.keystore
          key: field-journal-preview-key-v2
      - name: Configure repository signing key
        env:
          KEY_BASE64: ${{ secrets.FIELD_JOURNAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            umask 077
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/field-journal.jks"
            printf 'FIELD_JOURNAL_KEYSTORE=%s/field-journal.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          else
            key="$RUNNER_TEMP/field-journal-preview.keystore"
            if [ ! -f "$key" ]; then
              umask 077
              keytool -genkeypair -keystore "$key" -storetype JKS -storepass android -keypass android \
                -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' \
                -keyalg RSA -keysize 2048 -validity 10000 -noprompt
            fi
            printf 'FIELD_JOURNAL_KEYSTORE=%s\n' "$key" >> "$GITHUB_ENV"
          fi
      - name: Test and assemble
        env:
          FIELD_JOURNAL_STORE_PASSWORD: ${{ secrets.FIELD_JOURNAL_STORE_PASSWORD }}
          FIELD_JOURNAL_KEY_ALIAS: ${{ secrets.FIELD_JOURNAL_KEY_ALIAS }}
          FIELD_JOURNAL_KEY_PASSWORD: ${{ secrets.FIELD_JOURNAL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify and name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Field-Journal.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs dist/Field-Journal.apk
          cd dist
          sha256sum Field-Journal.apk > Field-Journal.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Field-Journal-APK
          path: dist/*
          if-no-files-found: error

  preview:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Field-Journal-APK
          path: dist
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if gh release view android-preview >/dev/null 2>&1; then
            gh release upload android-preview dist/Field-Journal.apk dist/Field-Journal.apk.sha256 --clobber
            gh release edit android-preview --notes "Установочный APK из Android Actions. Коммит: $BUILD_SHA."
          else
            gh release create android-preview dist/Field-Journal.apk dist/Field-Journal.apk.sha256 \
              --target "$BUILD_SHA" --title 'Полевой дневник · тестовая сборка' --prerelease \
              --notes "Установочный APK из Android Actions. Коммит: $BUILD_SHA."
          fi
